; Text3D 플러그인 설정. 이 프로젝트에서 Text3D 를 쓰는 곳은 차량 번호판 양각(ACarActor) 뿐이다.
[/Script/Text3D.Text3DProjectSettings]
; 글자마다 충돌을 만들면 비용이 크다(엔진 설정 주석: "Text3D with collisions can have a
; significant hit on perf"). 번호판 글자는 픽·물리 대상이 아니므로 전역으로 끈다.
bForceDisableTextCollision=True
; 글자 메시가 안 쓰이게 된 뒤 캐시를 비우기까지의 지연(초). 차량을 지웠다 다시 만드는 조작
; (리셋랜덤·프리셋 재적용)이 이 안에 들어오면 압출을 다시 하지 않는다.
FontFaceGlyphCleanupDelay=30.0
