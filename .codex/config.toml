personality = "friendly"

[agents]
# 루트 + 5개 Park3D 역할을 열 수 있는 상한. 호스트의 더 낮은 동시성 제한이 있으면 순차 실행한다.
max_threads = 6
max_depth = 1

[mcp_servers.unreal]
url = "http://localhost:8000/mcp"

# Park3D JSON-RPC(13120) → MCP 브리지. Claude .mcp.json 의 park3d-rpc 와 동등.
[mcp_servers.park3d-rpc]
command = "uv"
args = ["run", "D:/Work/UnrealWork/Parking/park3d-rpc-mcp/server.py"]
env = { PARK3D_RPC_URL = "http://localhost:13120" }
