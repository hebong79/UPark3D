; 에셋 비동기 컴파일 동시 실행 수 제한.
; 쿡이 차량 메시 34개를 한꺼번에 빌드하면(개당 요구 메모리 1.0~4.5GB) 커밋 차지가
; 68.4GB/69.5GB 까지 차서 OOM 직전에서 진행이 멈춘다. 4개로 제한하니 실측 피크가
; 43.3GB 로 내려가고 쿡이 579/579 로 완주했다. 자세한 내용은
; Docs/20260816_233500_패키지빌드_쿡정체_메모리한계_수정.md 참고.
; 되돌리기: 아래 한 줄을 지우면 엔진 기본값(-1, 무제한)으로 복귀한다.
[ConsoleVariables]
Editor.AsyncAssetCompilationMaxConcurrency=4

; HTTP 리스너 바인드 주소는 **포트별** override 로 정해진다.
; Park3D JSON-RPC 서버는 자기가 실제로 쓰는 포트의 override 를 기동 시 스스로 등록하므로
; (URpcServerSubsystem::EnsureListenerBindOverride) 여기에 포트를 적지 않는다 —
; 적어 두면 config 의 rpc_port 를 바꾸는 순간 목록이 빗나가 조용히 localhost 로 떨어진다(2026-08-17 사고).
;
; 전역 DefaultBindAddress=any 는 쓰지 않는다 — 그것은 이 프로세스의 모든 HTTP 리스너(현재+미래)가
; 상속으로 외부에 열리게 하며, 그런 리스너에는 우리 인증 게이트가 없다.
;
; 특정 포트를 강제로 다르게 열고 싶을 때만 아래 형식으로 직접 적는다(적힌 포트는 코드가 건드리지 않는다):
;   [HTTPServer.Listeners]
;   +ListenerOverrides=(Port=13510,BindAddress=any)
; 루프백 전용으로 되돌리려면 config_pmaker.json 에 "rpc_bind": "localhost" 를 넣는다.
