
[/Script/CommonUI.CommonUISettings]
CommonButtonAcceptKeyHandling=TriggerClick

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=43EA29F34BFD38BEB239418C7464B772

; Park3D JSON-RPC 서버 리슨 포트. 커맨드라인 -RpcPort= 가 있으면 그쪽이 우선.
; -RpcPort=0 은 "서버 미기동"을 뜻한다(리스닝 소켓을 아예 만들지 않음).
; 외부 바인드는 DefaultEngine.ini 의 [HTTPServer.Listeners] 에서 이 포트와 일치시켜야 한다.
[RpcServer]
Port=13510

; 인증 토큰. 비워두면 무토큰 모드 = 루프백(127.x/::1) 요청만 허용하고 외부 호스트는 401 로 거부한다.
; 커맨드라인 -RpcToken= 이 있으면 그쪽이 우선한다.
; ⚠ 허용 문자셋은 [A-Za-z0-9_-] 뿐이다. 콤마·괄호·공백을 넣으면 경로마다 다르게 잘려
;   (커맨드라인/헤더는 절단, 이 ini 는 원문 보존) 서버와 클라이언트의 토큰이 어긋나 영구 401 이 된다.
;   토큰 값은 로그에 출력되지 않으므로 이 사고는 추적이 매우 어렵다. 위반 시 기동 로그에 Error 가 남는다.
; ⚠ 실제 토큰 값은 저장소에 커밋하지 않는다. 로컬에서 -RpcToken= 으로 주거나 이 값을 로컬에서만 채운다.
Token=apark3d

; ⚠⚠ 인증 전면 우회 스위치. True 면 토큰·Origin·루프백 검사를 모두 건너뛴다.
;   → 위 Token 값도 무시된다. 13510 에 닿는 누구나 79개 메서드(저장 포함)를 호출할 수 있다.
;   폐쇄망 개발 편의를 위해 켜 둔 상태다. 외부망에 노출되는 환경에서는 반드시 False 로 되돌릴 것.
;   커맨드라인 -RpcAllowAnonymous 로도 켤 수 있다(끄는 스위치는 없다 — 끄려면 이 값을 False 로).
;   켜져 있으면 기동 로그에 Warning 배너가 매번 출력된다.
AllowAnonymous=True

; 카메라별 전용 포트 MJPEG 스트리밍(설계서 20260805_180808).
;   접속 URL: http://<IP>:13601/ = camId 1, :13602/ = camId 2 … (쿼리 없음)
;   13510 의 GET /stream?camId= 은 그대로 병존한다.
; ⚠ 보안 없음(연구단계 정책). 요청을 파싱하지 않고 접속 즉시 프레임을 보낸다.
[/Script/Park3D.CamStreamSubsystem]
bEnabled=True
; ⚠ 아래 BasePort/MaxCameras 는 Save/Config/config_pmaker.json 의 cam_port_min/cam_port_max 가
;   있으면 그 값으로 덮인다(config 우선, rpc_port 와 같은 규약). camId 1 = cam_port_min.
;   기본 config(13601~13610)는 아래 값과 같은 대역이라 동작 차이가 없다.
;   카메라 대수가 대역을 넘으면 파일 로딩/저장 시 config 의 cam_port_max 가 자동으로 늘어난다.
BasePort=13600
MaxCameras=10

; 동시에 프레임을 만드는 카메라 수. 포트는 카메라 수만큼 다 열리지만 캡처는 이 수만큼만 돈다.
; 병목은 포트가 아니라 게임 스레드 캡처 비용이다(1프레임 ≈ 48ms @1280x720).
; 기본 1 = 보고 있는 카메라 한 대씩 돌아가며. 초과 요청은 HardMaxSlots 로 clamp 된다.
ActiveSlots=1
HardMaxSlots=2

; 슬롯 최소 점유 시간(초). 이 값이 너무 작으면 순환 시 각 화면이 프레임 한 장만 받아 정지화면처럼 보인다.
MinHoldSeconds=2.0

; 이 시간(초) 안에 PTZ 조작을 받은 카메라를 우선 배정한다(조작 중 화면이 멈추면 제어 불가).
PtzRecentSeconds=3.0

; 총 캡처 예산(fps). bShareFpsBudget=True 면 슬롯 수로 나눠 배분한다
; → 슬롯을 1→2 로 올려도 게임 스레드 부하가 일정하다(채널당 2.5fps).
TotalFps=5.0
bShareFpsBudget=True
JpegQuality=70

; ---- 메인 뷰(플레이어 카메라) 채널 ----
; http://<IP>:13600/ 로 화면과 같은 시점이 나간다. UMG UI 는 포함되지 않는다(3D 씬만).
; PTZ 카메라와 달리 렌더타깃이 없어 플레이어 시점을 따라가는 전용 SceneCapture 를 런타임에 만든다.
; MainPort 는 config_pmaker.json 이 덮지 않는다 — 카메라 대수가 늘어도 자리가 밀리지 않게 고정.
; 기본 13600 은 카메라 대역(cam_port_min=13601~) 바로 앞자리라 충돌하지 않는다.
bMainViewEnabled=True
MainPort=13600

; 슬롯 예산(TotalFps)과 별개로 계산된다 — 즉 메인 뷰를 보는 동안 캡처 1대분 비용이 더 든다.
; 보는 클라이언트가 0명이면 캡처하지 않으므로 유휴 비용은 0 이다.
MainFps=10.0

; 창 크기와 무관하게 고정. 스트림 도중 해상도가 바뀌면 클라이언트가 깨질 수 있어 고정값을 쓴다.
; 960x540 = 1280x720 대비 픽셀 수 56%. 리드백/JPEG 인코딩 비용이 픽셀 수에 거의 비례하므로
; 캡처 비용을 낮추는 가장 확실한 손잡이다. 화질이 더 필요하면 1280x720 으로 되돌릴 수 있다.
MainWidth=960
MainHeight=540

; 동시에 진행하는 리드백 수(파이프라인 깊이). 리드백 1장이 GPU 에서 돌아오는 지연은 줄일 수 없으므로,
; 그 지연을 기다리지 않고 다음 요청을 걸어 처리량만 분리한다. 슬롯 1개면 처리량 상한이 1/지연 이고
; (실측 지연 약 300ms → 약 3fps), N 개면 N/지연 까지 오른다.
; 대가: 슬롯 수만큼 스테이징 텍스처가 더 잡히고(960x540 BGRA8 ≈ 2MB/장), 씬 캡처도 그만큼 자주 돈다.
; 1 로 두면 "한 장이 끝나야 다음을 건다"는 예전 동작과 같아진다(되돌릴 길).
; 막힌 곳은 cam.streamStatus 의 main.inFlight / main.skippedNoSlot / main.tickFps 로 본다.
MainReadbackSlots=3

; ---- 메인 뷰 캡처 성능 가드 ----
; 감시용 스트림이라 화질보다 프레임 안정성이 우선이다. 아래는 전부 "캡처 전용"으로만 걸리며
; 화면(플레이어 뷰)에는 영향이 없다. 재빌드 없이 이 파일만 고치고 재기동하면 반영된다.
;
; bMainGuardEnabled=False 로 두면 가드를 통째로 끈다 → 가드 유무의 캡처 비용을 숫자로 비교(A/B)할 때
; 이 한 줄만 바꾸고 cam.streamStatus 의 main.captureAvgMs / captureMaxMs 를 보면 된다.
bMainGuardEnabled=True

; 꺼도 되는 것들. 감시 화면에 잔상·눈부심·아웃포커스는 불필요하고 비용만 든다.
bMainDisableMotionBlur=True
bMainDisableBloom=True
bMainDisableDepthOfField=True

; SSR 을 꺼도 Lumen 리플렉션은 그대로 살아 있다(품질만 아래에서 하향). 반사가 사라지지 않는다.
bMainDisableScreenSpaceReflections=True

; ⚠ AA 를 끄면 TSR/TAA 경로가 통째로 빠진다. TSR 은 Lumen 노이즈를 걸러주는 역할도 하므로
;   캡처가 지글거릴 수 있다. 스트림이 거칠어 보이면 이 값을 False 로 되돌리는 것이 첫 손잡이다.
bMainDisableAntiAliasing=True

; ⚠ Lumen 은 "끄지 않고 품질만" 낮춘다. LumenGlobalIllumination / LumenReflections 쇼플래그는
;   코드에서 의도적으로 건드리지 않는다 — 끄는 순간 간접광이 빠져 스트림만 어둡고 갈색으로 나오는
;   증상이 재발한다(Park3D/Docs/Bug/20260806_163723_Park3D_스트림영상_간접광누락_진단.md).
;   아래 값은 엔진 기본이 1.0 이고, 범위는 각각 0.25~2 (SceneDetail 만 0.25~4) 로 클램프된다.
bMainLowerLumenQuality=True
MainLumenSceneLightingQuality=0.5
MainLumenFinalGatherQuality=0.5
MainLumenSceneDetail=0.5
MainLumenReflectionQuality=0.5

; ---- 캡처 소요시간 계측 ----
; 캡처 1회의 게임 스레드 총 비용(씬 캡처 + GPU 리드백 + JPEG 인코딩)을 재서
; 최근 MainStatWindow 회의 평균/최대를 로그와 cam.streamStatus 의 main 블록에 낸다.
MainStatWindow=60

; 통계 로그 주기(초). 0 이하면 로그를 남기지 않는다(수치는 cam.streamStatus 로 계속 조회 가능).
MainStatLogSeconds=30.0

; GameFeatures 플러그인이 요구하는 GameFeatureData 자산 규칙(없으면 쿠킹 시 Error → 패키징 실패).
; /Game/Unused = 실제 없는 경로(스캔 대상 0). 규칙 등록만으로 "no rule" 에러를 해소.
;
; 2026-08-17 비활성화: .uproject 에서 AllToolsets 이 빠지며 GameFeatures 플러그인도 함께 꺼졌다.
; 그 상태에서 이 줄을 남기면 AssetBaseClass 를 못 찾아 반대로 쿡이 죽는다
; ("Failed to load class /Script/GameFeatures.GameFeatureData"). 즉 이 줄은 GameFeatures 가
; 켜져 있을 때만 필요하다 — 플러그인을 다시 켜면 아래 주석을 함께 되살릴 것.
[/Script/Engine.AssetManagerSettings]
;+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))

[/Script/UnrealEd.ProjectPackagingSettings]
FullRebuild=True

; 차량 메시는 Save/Config/car_catalog.json 의 meshDir 로 런타임에 문자열 조립해 로드한다
; (DT_CarCatalog 를 없앤 뒤로 에셋 참조가 하나도 없다). 쿠커는 에셋 참조만 따라가므로
; 이 지시가 없으면 메시가 쿡에서 통째로 빠져 패키지에서만 차량이 안 보인다
; — 에디터는 디스크에서 직접 읽으므로 멀쩡해 보여 놓치기 쉽다.
; 재질·텍스처는 메시가 참조하므로 따라 쿡된다.
+DirectoriesToAlwaysCook=(Path="/Game/Actors/Car/Meshs")

